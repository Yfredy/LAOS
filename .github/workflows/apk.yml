name: apk

# 打 v* tag 时构建安卓壳 APK 并挂到对应 Release 页——
# "release 只有代码没有编译物"的补齐：laos 本体纯 Python 源码即成品，
# 唯一需要编译的交付物就是这个壳。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # softprops 上传附件需要写 Release 权限

jobs:
  apk:
    runs-on: ubuntu-24.04  # 钉版本：ubuntu-latest 2026-10-19 迁 Ubuntu 26，新镜像+Gradle 组合的历史兼容坑不值得赌
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 预装 Android SDK（含 cmdline-tools 与已接受的许可），
      # 不用 setup-android——v3 在新 runner 镜像上有兼容问题且本就多余。

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"   # 仓内无 gradlew（刻意不提交 wrapper 二进制），CI 装指定版

      - name: assembleDebug（debug 签名可直接侧载）
        run: |
          set -o pipefail
          gradle -p clients/android assembleDebug --stacktrace 2>&1 | tee clients/android/build.log

      - name: 失败时打包构建报告（诊断用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            clients/android/app/build/reports
            clients/android/build.log
          if-no-files-found: ignore

      - name: 统一文件名
        run: |
          mv clients/android/app/build/outputs/apk/debug/app-debug.apk \
             clients/android/app/build/outputs/apk/debug/laos-client.apk

      - name: 上传到 Release 页
        uses: softprops/action-gh-release@v2
        with:
          files: clients/android/app/build/outputs/apk/debug/laos-client.apk
