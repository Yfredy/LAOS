name: apk

# 打 v* tag 时构建安卓壳 APK 并挂到对应 Release 页——
# "release 只有代码没有编译物"的补齐：laos 本体纯 Python 源码即成品，
# 唯一需要编译的交付物就是这个壳。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # softprops 上传附件需要写 Release 权限

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 预装 Android SDK（含 cmdline-tools 与已接受的许可），
      # 不用 setup-android——v3 在新 runner 镜像上有兼容问题且本就多余。

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"   # 仓内无 gradlew（刻意不提交 wrapper 二进制），CI 装指定版

      - name: assembleDebug（debug 签名可直接侧载）
        run: gradle -p clients/android assembleDebug --stacktrace

      - name: 统一文件名
        run: |
          mv clients/android/app/build/outputs/apk/debug/app-debug.apk \
             clients/android/app/build/outputs/apk/debug/laos-client.apk

      - name: 上传到 Release 页
        uses: softprops/action-gh-release@v2
        with:
          files: clients/android/app/build/outputs/apk/debug/laos-client.apk
